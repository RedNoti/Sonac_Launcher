<!doctype html>
<html lang="ko" class="prompt-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>sonac launcher</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="prompt.js"></script>
</head>
<body>
  <dialog id="prompt" aria-labelledby="prompt-title" aria-describedby="prompt-message">
    <div>
      <header class="dialog-header"><h2 id="prompt-title"></h2></header>
      <p id="prompt-message"></p>
      <p id="prompt-detail" hidden></p>
    </div>
    <label id="prompt-skip" class="check" hidden>
      <input id="prompt-skip-input" type="checkbox">파일 작업 확인창 다시 보지 않기
    </label>
    <label id="prompt-remember" class="check" hidden>
      <input id="prompt-remember-input" type="checkbox">앞으로 중복되는 파일에도 이 선택 적용
    </label>
    <footer class="dialog-actions" id="prompt-actions">
      <button id="prompt-cancel" type="button" autofocus>취소</button>
      <button id="prompt-accept" type="button" class="primary">확인</button>
    </footer>
  </dialog>
</body>
</html>
